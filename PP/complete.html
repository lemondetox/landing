<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0">
    <title>PLACE PARTNER | 신청 완료</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-red: #d32f2f;
            --bg-light: #f8f9fa;
            --text-main: #222222;
            --text-sub: #666666;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Noto Sans KR', sans-serif;
            background-color: var(--bg-light);
            color: var(--text-main);
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }

        .complete-card {
            background: #ffffff;
            max-width: 500px;
            width: 100%;
            padding: 50px 24px;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
            text-align: center;
            border: 1px solid #e0e0e0;
        }

        .icon-box {
            width: 72px;
            height: 72px;
            background: #ffebee;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 20px;
        }

        .icon-box svg {
            width: 38px;
            height: 38px;
            fill: var(--primary-red);
        }

        .tag {
            color: var(--primary-red);
            font-size: 0.85rem;
            font-weight: 700;
            letter-spacing: 1px;
            margin-bottom: 8px;
        }

        .title {
            font-size: 1.5rem;
            font-weight: 900;
            color: #111;
            margin-bottom: 16px;
            line-height: 1.35;
        }

        .desc {
            font-size: 0.95rem;
            color: var(--text-sub);
            line-height: 1.6;
            margin-bottom: 32px;
            word-break: keep-all;
        }

        .btn-home {
            display: block;
            width: 100%;
            padding: 16px;
            background: var(--primary-red);
            color: #ffffff;
            font-size: 1.05rem;
            font-weight: 700;
            text-decoration: none;
            border-radius: 8px;
            box-shadow: 0 4px 14px rgba(211, 47, 47, 0.25);
            transition: background 0.2s;
        }

        .btn-home:hover {
            background: #b71c1c;
        }
    </style>
</head>
<body>

    <div class="complete-card">
        <div class="icon-box">
            <svg viewBox="0 0 24 24">
                <path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/>
            </svg>
        </div>
        <div class="tag">PLACE PARTNER</div>
        <h1 class="title">플레이스 가이드 신청이<br>정상 완료되었습니다!</h1>
        <p class="desc">
            입력해주신 매장 정보와 플레이스 URL을 바탕으로<br>
            전문 분석 및 차별화된 맞춤형 성장 가이드를 작성하여<br>
            남겨주신 연락처로 빠르게 전달해 드리겠습니다.
        </p>
        <a href="index.html" class="btn-home">돌아가기</a>
    </div>

</body>
</html>
