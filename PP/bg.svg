<svg xmlns="http://www.w3.org/2000/svg" width="300" height="200" viewBox="0 0 300 200">
    <style>
        .text { font-family: 'Noto Sans KR', sans-serif; font-weight: 900; font-size: 20px; fill: #d32f2f; fill-opacity: 0.04; }
        .grid { fill: none; stroke: #d32f2f; stroke-width: 1; stroke-opacity: 0.025; stroke-dasharray: 4 4; }
        .dot { fill: #d32f2f; fill-opacity: 0.05; }
    </style>

    <!-- 은은한 배경 그리드선 -->
    <path class="grid" d="M 0,100 L 300,100 M 150,0 L 150,200" />

    <!-- 대각선 워터마크 텍스트 -->
    <text x="150" y="100" class="text" text-anchor="middle" transform="rotate(-15, 150, 100)">PLACE PARTNER</text>

    <!-- 코너 그래픽 닷 패턴 -->
    <circle class="dot" cx="20" cy="20" r="3" />
    <circle class="dot" cx="280" cy="180" r="3" />
</svg>
