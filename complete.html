<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0">
    <title>GENTLE STUDIO | 지원 완료</title>
    
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/gmarket-sans@1.0.0/fonts.css">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700;900&display=swap" rel="stylesheet">
    
    <style>
        /* 완료 페이지 전용 프리미엄 다크 무드 스타일 */
        .complete-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background: #111; /* 기존 젠틀스튜디오 테마와 맞춘 블랙 배경 */
            color: #fff;
            text-align: center;
            padding: 20px;
            box-sizing: border-box;
        }
        .complete-title {
            font-size: 3rem;
            margin-bottom: 20px;
            letter-spacing: 2px;
        }
        .complete-desc {
            font-size: 1.2rem;
            color: #aaa;
            line-height: 1.8;
            margin-bottom: 40px;
        }
        
        /* ⭐️ [핵심 수정] style.css의 노란색 하이라이트 배경을 완벽히 무력화 */
        .complete-desc .highlight {
            background: transparent !important; /* 노란색 배경 삭제 */
            background-color: transparent !important;
            color: #ffffff !important; /* 글씨색을 선명한 흰색으로 강제 고정 */
            font-weight: 700;
            border-bottom: 2px solid #fff; /* 세련된 밑줄 포인트 */
            padding: 0 2px;
        }
    </style>
</head>
<body class="loaded">

    <div class="complete-wrapper">
        <div class="reveal active" style="opacity: 1; transform: translateY(0);">
            <img src="https://rawcdn.githack.com/lemondetox/landing/0a949141387219ff64a2cb043e530c720ded1654/GentleStudio_W.png?raw=true" 
                 alt="GENTLE STUDIO" 
                 class="main-logo" 
                 style="margin-bottom: 35px; max-width: 240px; height: auto;">
            
            <h2 class="aggro-text complete-title">THANK YOU</h2>
            <p class="complete-desc">
                신규 크리에이터 지원서가 <span class="highlight">정상적으로 접수되었습니다.</span><br>
                내부 검토 후 빠른 시일 내에 기재해 주신 연락처로 연락드리겠습니다.
            </p>
            
            <a href="index.html" class="btn" style="display: inline-block; text-decoration: none;">
                메인 페이지로 돌아가기
            </a>
        </div>
    </div>

</body>
</html>
